  <style>
    :root {
      --neon-red: #ff2a6d;
      --neon-pink: #ff69b4;
      --dark-bg: #0e0e1a;
      --white: #ffffff;
    }

    body {
      margin: 0;
      background: var(--dark-bg);
      overflow: hidden;
      font-family: 'Great Vibes', cursive;
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1.2);
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .ribbon {
      fill: none;
      stroke: var(--neon-red);
      stroke-width: 4;
      stroke-dasharray: 1500;
      stroke-dashoffset: 1500;
      filter: drop-shadow(0 0 15px var(--neon-red)) drop-shadow(0 0 30px var(--neon-red));
    }

    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%) rotateY(90deg);
      width: 300px;
      height: 400px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: transform 1s ease, opacity 0.5s ease;
      z-index: 2;
    }

    .card.opened {
      transform: translate(-50%, -50%) rotateY(0deg);
      animation: flipCard 1s ease forwards;
    }

    .card.opened .inner-message {
      display: block;
      animation: fadeIn 1.5s ease forwards;
    }

    .card h1 {
      color: var(--white);
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .card p {
      color: #ccc;
      padding: 0 20px;
      text-align: center;
    }

    .card button {
      margin-top: 20px;
      background: var(--neon-red);
      border: none;
      color: var(--white);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 10px var(--neon-red), 0 0 30px var(--neon-red);
    }

    .inner-message {
      display: none;
      margin-top: 30px;
      text-align: center;
      color: var(--white);
    }

    .bantik {
      width: 60px;
      height: 60px;
      background: var(--neon-pink);
      border-radius: 50%;
      margin: 0 auto;
      margin-top: 15px;
      box-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes flipCard {
      from { transform: translate(-50%, -50%) rotateY(90deg); }
      to { transform: translate(-50%, -50%) rotateY(0deg); }
    }
  </style>
</head>
